# GreenTrace emission factor seed data.
#
# Rules for this file:
#   * Every value is copied from the official publication cited in its row.
#     Nothing here is estimated or invented.
#   * `published` holds the value(s) EXACTLY as printed by the source. The loader
#     (app/seed.py) derives kgco2e_per_unit from them; the derivation is stored with the row.
#   * `per_unit` is the denominator as published; the calculation engine converts bill
#     quantities to it (same dimension only, never m3 -> energy).
#   * valid_from / valid_to define which billing dates a factor applies to. A bill date
#     with no matching factor fails loudly; extend coverage by adding a new factor or
#     version, never by editing logic.
#   * Loading is idempotent on (key, version). To correct a value, add the same key with
#     version + 1; the old version is kept and marked superseded.
#
# Seeded on 2026-10-13. Sources were read from official PDFs/spreadsheets on that date
# unless a row says otherwise.

gwp_sets:
  AR5:
    # TODO: verify against latest published edition
    source_name: "IPCC Fifth Assessment Report (2013), 100-year GWP, as tabulated in US EPA GHG Emission Factors Hub (Jan 2025), Table 11"
    source_url: "https://www.epa.gov/system/files/documents/2025-01/ghg-emission-factors-hub-2025.pdf"
    values: {CO2: "1", CH4: "28", N2O: "265"}

factors:

  # ---------------------------------------------------------------- India: grid electricity
  # CEA weighted average emission factor of the Indian grid, including renewables and
  # captive injection, adjusted for cross-border transfers. CO2 only (CEA does not publish
  # CH4/N2O), so ghg_basis = CO2. Indian fiscal year: 1 April - 31 March.

  # TODO: verify against latest published edition
  - key: IN-CEA-GRID-FY2022-23
    version: 1
    utility_type: electricity
    region: IN
    per_unit: MWh
    published:
      - {gas: CO2, value: "0.716", mass_unit: t}
    source_name: "CEA CO2 Baseline Database for the Indian Power Sector, User Guide Version 20.0 (Dec 2024), Annexure-I: weighted average emission factor of grid electricity including RE, FY 2022-23 (revised in v20)"
    source_url: "https://cea.nic.in/cdm-co2-baseline-database/?lang=en"
    publication_year: 2024
    valid_from: 2022-04-01
    valid_to: 2023-03-31
    notes: "Value read from a copy of the v20 User Guide (https://static-cdn.publive.online/saur-energy/media/pdf_files/2025/01user_guide_version_20.0.pdf); cea.nic.in direct PDF links required login at seeding time."

  # TODO: verify against latest published edition
  - key: IN-CEA-GRID-FY2023-24
    version: 1
    utility_type: electricity
    region: IN
    per_unit: MWh
    published:
      - {gas: CO2, value: "0.727", mass_unit: t}
    source_name: "CEA CO2 Baseline Database for the Indian Power Sector, User Guide Version 20.0 (Dec 2024), Table S: weighted average emission factor, FY 2023-24"
    source_url: "https://cea.nic.in/cdm-co2-baseline-database/?lang=en"
    publication_year: 2024
    valid_from: 2023-04-01
    valid_to: 2024-03-31
    notes: "Value read from a copy of the v20 User Guide (https://static-cdn.publive.online/saur-energy/media/pdf_files/2025/01user_guide_version_20.0.pdf); cea.nic.in direct PDF links required login at seeding time."

  # TODO: verify against latest published edition
  # NOT VERIFIED FROM THE PDF: the v21 guide was behind a login wall at seeding time. The value
  # comes from a search-engine extract of the official v21 PDF and two secondary sites (one of
  # which reports 0.7117 excluding imports). Confirm Table S of the v21 guide before reporting.
  - key: IN-CEA-GRID-FY2024-25
    version: 1
    utility_type: electricity
    region: IN
    per_unit: MWh
    published:
      - {gas: CO2, value: "0.710", mass_unit: t}
    source_name: "CEA CO2 Baseline Database for the Indian Power Sector, User Guide Version 21.0 (Dec 2025), Table S: weighted average emission factor, FY 2024-25"
    source_url: "https://cea.nic.in/wp-content/uploads/baseline/2025/12/User_Guide_V_21.0.pdf"
    publication_year: 2025
    valid_from: 2024-04-01
    valid_to: 2025-03-31
    notes: "UNVERIFIED against the source PDF (login wall at seeding time). See comment in seed file."

  # ---------------------------------------------------------------- India: natural gas
  # No Indian government factor for natural gas combustion; IPCC 2006 defaults are the
  # standard choice. Table 2.3 = manufacturing industries & construction. For offices /
  # commercial sites Table 2.4 gives CH4 = 5 kg/TJ instead of 1. Fuel chemistry does not
  # change by year, so the window is open-ended.

  # TODO: verify against latest published edition
  - key: IN-IPCC2006-NATGAS-MFG
    version: 1
    utility_type: natural_gas
    region: IN
    per_unit: TJ
    published:
      - {gas: CO2, value: "56100", mass_unit: kg}
      - {gas: CH4, value: "1", mass_unit: kg}
      - {gas: N2O, value: "0.1", mass_unit: kg}
    gwp_set: AR5
    source_name: "2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol. 2 Energy, Ch. 2 Stationary Combustion, Table 2.3 (manufacturing industries and construction), natural gas default factors"
    source_url: "https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_2_Ch2_Stationary_Combustion.pdf"
    publication_year: 2006
    valid_from: 2006-01-01
    valid_to: null
    notes: "Energy basis is net calorific value (NCV) per IPCC convention. Indian PNG bills in SCM need the supplier's stated calorific value to convert to energy."

