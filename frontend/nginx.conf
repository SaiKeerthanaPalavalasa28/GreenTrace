server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Batch uploads: up to 50 files x 20 MB (see MAX_FILES_PER_UPLOAD / MAX_UPLOAD_MB).
    client_max_body_size 1100m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # report generation, large uploads
        proxy_request_buffering off;
    }

    # Hashed build assets can be cached forever; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy same-origin;
        try_files $uri /index.html;   # client-side routes
    }
}
